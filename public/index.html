<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bookify - Book to Playlist</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Bookify</h1>
      <p class="subtitle">Transform your reading into a musical journey</p>
    </header>

    <main id="main-content">
      <form id="book-form" class="book-form">
        <div class="form-group">
          <label for="bookTitle">Book Title *</label>
          <input type="text" id="bookTitle" name="bookTitle" required
                 placeholder="e.g., Pride and Prejudice">
        </div>

        <div class="form-group">
          <label for="author">Author</label>
          <input type="text" id="author" name="author"
                 placeholder="e.g., Jane Austen">
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="chapter">Chapter/Section</label>
            <input type="text" id="chapter" name="chapter"
                   placeholder="e.g., Chapter 1">
          </div>
        </div>

        <div class="form-group">
          <label for="chapterDescription">Chapter Description (optional)</label>
          <textarea id="chapterDescription" name="chapterDescription" rows="3"
                    placeholder="Describe the mood or key events to get more tailored music"></textarea>
        </div>

        <button type="submit" class="btn btn-primary" id="generate-btn">
          Generate Playlist
        </button>
      </form>

      <div id="loading" class="loading hidden">
        <div class="spinner"></div>
        <p>Analyzing your book with AI...</p>
      </div>

      <div id="result" class="result hidden">
        <div class="result-header">
          <h2>Your Playlist</h2>
        </div>

        <div id="analysis" class="analysis">
          <h3>Book Analysis</h3>
          <p><strong>Era:</strong> <span id="era"></span></p>
          <p><strong>Moods:</strong> <span id="moods"></span></p>
          <p><strong>Genres:</strong> <span id="genres"></span></p>
        </div>

        <div class="playlist-info">
          <h3 id="playlist-name"></h3>
          <p id="playlist-description"></p>
          <p id="track-count"></p>
        </div>

        <div id="tracks-list" class="tracks-list">
          <h3>Recommended Songs</h3>
          <p class="tracks-hint">Click to open in Spotify or YouTube</p>
          <ul id="tracks"></ul>
        </div>

        <button class="btn btn-secondary" onclick="resetForm()">
          Create Another Playlist
        </button>
      </div>

      <div id="error" class="error hidden">
        <p id="error-message"></p>
        <button class="btn btn-secondary" onclick="resetForm()">Try Again</button>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
